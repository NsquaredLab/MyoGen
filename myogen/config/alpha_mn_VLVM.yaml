# Example custom configuration for Alpha Motor Neuron Pool
# This file demonstrates how to customize parameters for specific experiments
# Copy this file and modify values as needed for your simulation

# General parameters
model: "NERLab"  # Using Powers2017 model for this example
mode: "active"


# NERLab Model Parameters (uncomment and modify if using model: "NERLab")
# These parameters control the alpha and beta rate functions for ion channel gating
nerlab:
  napp:
    # m gate - sodium activation 
    m_alpha_A: 6.4  
    m_beta_A: 5.6  
  
    # h gate - sodium inactivation 
    h_alpha_A: 0.0928  
    h_beta_A: 0.9
  
    # p gate - persistent sodium activation
    p_alpha_A: 0.64  
    p_beta_A: 0.56  
    
    # n gate - fast potassium activation
    n_alpha_A: 0.00008  
    n_beta_A: 0.0002  
    
    # r gate - slow potassium activation
    r_alpha_A: 35.0

# Powers2017 Model Parameters
# You can override any subset of parameters - unspecified values will use defaults
powers2017:
  soma:
    # Only override specific parameters you want to change
    length_range: [3000, 3700, 0.3]
    diameter_range: [23, 31, 0.3]
    # Other soma parameters will use defaults from alpha_mn_default.yaml
    
  dendrite:
    # Example: modify dendrite properties for a specific experiment
    length_range: [1800, 2300, 0.3]
    diameter_range: [9.0, 12.0, 0.3]
    
    # Custom calcium conductances for each dendrite
    ca_conductance_ranges:
      - [9.0e-5, 1.2e-4, 0.3]
      - [1.0e-4, 1.3e-4, 0.3]
      - [1.1e-4, 1.4e-4, 0.3]
      - [1.2e-4, 1.6e-4, 0.3]

