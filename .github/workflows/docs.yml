name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments concurrently.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # NEURON + MPI system libraries: the example gallery executes the
      # NEURON-based examples at build time, so these must be present (same
      # set the old Sphinx docs workflow installed).
      - name: Install NEURON/MPI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev libgtk2.0-dev \
            openmpi-bin openmpi-common libopenmpi-dev \
            infiniband-diags ibverbs-utils libibverbs-dev \
            libfabric1 libfabric-dev libpsm2-dev librdmacm-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Sync project + docs/nwb extras
        run: uv sync --locked --group docs --extra nwb

      - name: Compile NMODL mechanisms
        run: uv run poe setup_myogen

      - name: Build docs site (executes the example gallery)
        run: uv run --group docs properdocs build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
