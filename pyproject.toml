[project]
name = "MyoGen"
version = "0.11.0"
description = "Modular and extensible neuromuscular simulation framework for generating physiologically grounded motor-unit activity, muscle force, and EMG signals (surface and intramuscular)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Raul C. Sîmpetru", email = "raul.simpetru@fau.de"},
    {name = "Ricardo G. Molinari", email = "molinari@gmail.com"},
]
maintainers = [
    {name = "Raul C. Sîmpetru", email = "raul.simpetru@fau.de"},
    {name = "Ricardo G. Molinari", email = "molinari@gmail.com"},
]
keywords = ["EMG", "electromyography", "neuromuscular", "simulation", "motor-unit", "NEURON", "neuroscience"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "beartype>=0.21.0",
    "jax==0.9.0",
    "jaxley==0.13.0",
    "jaxley-mech==0.3.1",
    "joblib>=1.3",
    "matplotlib>=3.10.1",
    "neo>=0.14.0",
    "numba>=0.61.2",
    "numpy>=1.26",
    "optuna>=4.5.0",
    "pandas>=2.0",
    "quantities>=0.16.2",
    "scienceplots>=2.1.1",
    "scikit-fmm>=2025.1.29",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
nwb = [
    "pynwb>=2.8.0",
    "nwbinspector>=0.5.0",
    "h5py>=3.0",
]
# Optional NEURON backend (validation reference). Jaxley is the default backend and
# requires none of these. Install with:  pip install "myogen[neuron]"
neuron = [
    "neuron==8.2.7 ; sys_platform == 'linux' or sys_platform == 'darwin'",
    "mpi4py>=4.0.3",
    "impi-rt>=2021.15.0 ; sys_platform == 'win32'",
]
gpu = [
    "cupy-cuda12x>=13.0,<14",
]

[project.urls]
Homepage = "https://nsquaredlab.github.io/MyoGen/"
Documentation = "https://nsquaredlab.github.io/MyoGen/"
Repository = "https://github.com/NsquaredLab/MyoGen"
Issues = "https://github.com/NsquaredLab/MyoGen/issues"
Changelog = "https://github.com/NsquaredLab/MyoGen/blob/main/CHANGELOG.md"
Contributors = "https://github.com/NsquaredLab/MyoGen#contributors"

[tool.ty.rules]
invalid-syntax-in-forward-annotation = "ignore"
possibly-unbound-import = "ignore"

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.0.250703",
    "poethepoet>=0.37.0",
    "pytest>=8.0",
    "scipy-stubs>=1.16.1.0",
]
docs = [
    "properdocs>=1.6.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-section-index>=0.3",
    "mkdocs-gallery>=0.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
setup_myogen = "python -c 'from myogen import _setup_myogen; _setup_myogen()'"

[build-system]
requires = ["setuptools>=61.0", "Cython>=3.0.0", "numpy>=2.0", "scipy>=1.15.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["myogen*"]

[tool.setuptools.package-data]
myogen = [
    "**/*.pyx",
    "**/*.pxd",
    "**/*.c",
    "**/*.h",
    "**/*.cpp",
    "**/*.mod",
    "**/*.dll",
    "**/*.so",
    "**/*.o",
    "**/*.yaml",
    "**/*.csv",
    "**/x86_64/*",
    "**/x86_64/.libs/*",
    "**/aarch64/*",
    "**/aarch64/.libs/*",
    "**/arm64/*",
    "**/arm64/.libs/*",
]
