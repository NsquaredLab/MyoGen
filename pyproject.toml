[project]
name = "MyoGen"
version = "0.6.0"
description = "Surface and Intramuscular EMG simulation toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.21.0",
    "cython>=3.1.3",
    "impi-rt>=2021.15.0 ; sys_platform == 'win32'",
    "matplotlib>=3.10.1",
    "mpi4py>=4.0.3",
    "neuron==8.2.7 ; sys_platform == 'linux' or sys_platform == 'darwin'",
    #"neuron-gpu-nightly>=9.0a0",
    #"neuron-nightly>=9.0a1.dev1492",
    "noise>=1.2.2",
    "numba>=0.61.2",
    "numpy>=1.26",
    "optuna>=4.5.0",
    "pyqt6>=6.9.0",
    "quantities>=0.16.2",
    "scienceplots>=2.1.1",
    "scikit-fmm>=2025.1.29",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "scipy-stubs==1.16.1.0",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "tqdm>=4.67.1",
    "viziphant>=0.4.0",
]

[tool.ty.rules]
invalid-syntax-in-forward-annotation = "ignore"
possibly-unbound-import = "ignore"

[project.optional-dependencies]
elephant = [
    "elephant @ git+https://github.com/INM-6/elephant@389f53830d37290611af34e363d1d382a05e4d1e",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.0.250703",
    "poethepoet>=0.37.0",
    "scipy-stubs>=1.16.1.0",
]
docs = [
    "elephant @ git+https://github.com/INM-6/elephant@389f53830d37290611af34e363d1d382a05e4d1e",
    "enum-tools[sphinx]>=0.12.0",
    "linkify-it-py>=2.0.3",
    "memory-profiler>=0.61.0",
    "pydata-sphinx-theme>=0.16.1",
    "pygments>=2.19.2",
    "rinohtype>=0.5.5",
    "roman>=5.2",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=2.5.0",
    "sphinx-design>=0.6.1",
    "sphinx-gallery>=0.19.0",
    "sphinx-hoverxref>=1.4.1",
    "sphinxcontrib-mermaid>=1.0.0",
    "toml>=0.10.2",
]

[tool.poe.tasks]
setup_myogen = "python -c 'from myogen import _setup_myogen; _setup_myogen()'"

[build-system]
requires = ["setuptools>=61.0", "Cython>=3.0.0", "numpy>=1.26", "scipy>=1.15.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["myogen*"]

[tool.setuptools.package-data]
myogen = [
    "**/*.pyx",
    "**/*.pxd",
    "**/*.c",
    "**/*.mod",
    "**/*.dll",
    "**/*.so",
    "**/nrnmech.dll",
    "**/libnrnmech.so",
    "**/*.o",
    "**/mod_func.c",
]
